{% extends "base.html" %}
{% block title %}Event - CampusConnect{% endblock %}
{% block content %}
<div class="card form-card">
  <h1>{{ 'Edit' if event else 'New' }} Event</h1>
  <form method="post">
    <label>Title</label><input type="text" name="title" value="{{ event['title'] if event }}" required>
    <label>Date &amp; time</label><input type="datetime-local" name="event_date" value="{{ event['event_date'].replace(' ','T') if event }}" required>
    <label>Venue</label><input type="text" name="venue" value="{{ event['venue'] if event }}" required>
    <label>Description</label><textarea name="description" required>{{ event['description'] if event }}</textarea>
    <button class="btn" type="submit">{{ 'Save changes' if event else 'Create event' }}</button>
    <a class="btn outline" href="{{ url_for('events') }}">Cancel</a>
  </form>
</div>
{% endblock %}
